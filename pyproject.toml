[project]
name = "docs-rag"
version = "0.1.0"
description = "사내 문서 RAG 검색 API + MCP 서버 (학습 프로젝트)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "pypdf>=4.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "mcp>=2.0",
    "sse-starlette>=2.1",
    "arq>=0.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 기본(E,F)에 더해: bugbear(실수 유발 패턴), isort(import 정렬), pyupgrade(구문 현대화),
# flake8-simplify(불필요한 분기). ARG(미사용 인자)는 arq ctx·pytest 픽스처 관용구와 충돌해 뺐다.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의존성 주입 관용구(Depends/Security 기본값 인자)는 B008 예외 처리
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]
